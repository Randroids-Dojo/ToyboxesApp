<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Toyboxes Google Play developer header</title>
<style>
@font-face{font-family:Lilita;src:url('../../public/assets/fonts/lilita-one.woff2')}
@font-face{font-family:Atkinson;src:url('../../public/assets/fonts/atkinson-hyperlegible-next.woff2')}
*{box-sizing:border-box}html,body{margin:0;width:4096px;height:2304px;overflow:hidden}
body{background:#edf6ff;color:#192d50;font-family:Atkinson,sans-serif;padding:180px 208px}
header{display:flex;align-items:center;gap:100px;height:430px;margin-bottom:150px}
.brand-icon{width:400px;height:400px;border-radius:80px}
h1,h2,p{margin:0}h1{font-family:Lilita,sans-serif;font-size:310px;font-weight:400;line-height:1}
header p{font-size:82px;margin-top:26px;line-height:1.2}
main{display:grid;grid-template-columns:1fr 1fr;gap:144px}
figure{margin:0}.shot{display:block;width:100%;aspect-ratio:16/9;border-radius:36px;outline:8px solid #192d50;outline-offset:-8px}
figcaption{padding-top:64px}h2{font-family:Lilita,sans-serif;font-size:112px;font-weight:400;line-height:1.1}
figcaption p{font-size:70px;line-height:1.3;margin-top:24px;color:#4b6078}
</style>
<header><img class="brand-icon" src="../../public/assets/toyboxes-icon.png" alt="Toyboxes icon"><div><h1>Toyboxes</h1><p>Small worlds. Distinct ways to play.</p></div></header>
<main>
<figure><img class="shot" src="../../public/assets/jokers-run/canyon-chase.webp" alt="Joker's Run canyon chase gameplay"><figcaption><h2>Joker’s Run</h2><p>Arcade air combat</p></figcaption></figure>
<figure><img class="shot" src="../../public/assets/perspective-opus/phone-01-overture-stage.webp" alt="Perspective Opus 3D Stage gameplay"><figcaption><h2>Perspective Opus</h2><p>Musical 2D/3D puzzle platformer</p></figcaption></figure>
</main>
</html>
